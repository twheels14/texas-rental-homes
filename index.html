<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Investment Property Search</title>

<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;padding:0 max(16px,env(safe-area-inset-left,0px)) 28px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--teal-ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto}
.top{padding:14px 0 6px;font-size:15px;color:var(--muted)}.top b{color:var(--ink)}
.lang{display:flex;gap:6px;margin:0 0 6px}
.lang button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700;min-height:38px}
.lang button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
h1{font-size:clamp(28px,5.5vw,40px);line-height:1.1;margin:8px 0 8px;font-weight:900;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.note{background:var(--gold);border:2px solid var(--gold-line);color:var(--gold-ink);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:15px}
.filters{padding:16px;margin:12px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.filters select,.filters input[type=number]{border:2px solid var(--line);background:var(--bg);border-radius:12px;min-height:46px;padding:0 10px;font-size:16px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.cities{grid-column:1/-1}.srch{grid-column:1/-1}.filters input[type=text],.filters input[type=search]{border:2px solid var(--line);background:var(--bg);border-radius:12px;min-height:50px;padding:0 12px;font-size:17px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.cities summary{cursor:pointer;font-weight:900;padding:6px 0;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip small{color:var(--muted);font-weight:700}.chip[aria-pressed=true] small{color:var(--navy-ink);opacity:.8}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.count{font-size:26px;font-weight:900}.count small{font-size:16px;color:var(--muted);font-weight:700}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 16px;font-weight:900}
.btn:hover{border-color:var(--teal)}
.home{padding:16px 18px;margin:0 0 12px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.addr{font-weight:900;font-size:19px;direction:ltr}html[dir=rtl] .addr{text-align:right}
.loc{color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tags .tag{margin:0}
.big{text-align:end}.big .y{font-size:30px;font-weight:900;color:var(--good);line-height:1;font-variant-numeric:tabular-nums}
.big .yl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.nums{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.nums div{background:var(--bg);border-radius:12px;padding:8px 12px}
.nums b{display:block;font-size:19px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:plaintext}
.nums span{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;margin-inline-start:6px}
.tag.drop{background:var(--drop-soft);color:var(--drop)}.tag.low{background:var(--gold);color:var(--gold-ink)}.tag.ok{background:var(--good-soft);color:var(--good)}
.links{grid-column:1/-1;font-size:14px;color:var(--muted)}
.share{display:inline-flex;align-items:center;gap:8px}.share[data-ok=true]{border-color:var(--good);color:var(--good)}
.more{display:block;width:100%;min-height:52px;font-size:16px;font-weight:900;color:var(--teal-ink);border:2px solid var(--line);background:var(--surface);border-radius:14px}
.foot{margin-top:24px;font-size:14px;color:var(--muted);line-height:1.5}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);font-size:16px;margin-bottom:12px}
.status{padding:30px 6px;color:var(--muted);font-size:18px}
.meth{padding:14px 18px;margin:12px 0;font-size:15px}.meth summary{font-weight:900;cursor:pointer;font-size:16px}
.meth table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.meth td,.meth th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:start}
@media (max-width:560px){.home{grid-template-columns:1fr}.big{text-align:start}}

function addMonths(d,m){const x=new Date(d);x.setDate(x.getDate()+Math.round(m*30.44));return x}
let REF={};
function rentFor(city,beds,sqft){const c=R.cities[city];if(!c)return null;let r=beds<=2?c[0]*.85:beds===3?c[0]:beds===4?c[1]:c[1]*1.12;
 const ref=REF[Math.min(beds,5)];if(ref&&sqft)r*=Math.min(1.12,Math.max(.85,Math.sqrt(sqft/ref)));
 return Math.round(r*(1+S.rent/100)/25)*25}
let ALL=[];
function prep(){if(!Object.keys(REF).length){const g={};D.h.forEach(h=>{const b=Math.min(h[5],5);(g[b]=g[b]||[]).push(h[7])});for(const b in g){const a=g[b].sort((x,y)=>x-y);REF[b]=a[a.length>>1]}}
 ALL=D.h.map((h,i)=>{const comm=D.c[h[0]],price=h[8],city=h[10],rent=rentFor(city,h[5],h[7]);if(!rent||!price)return null;
 const coe=dOf(h[1]);const ready=coe<=TODAY;const rs=addMonths(ready?TODAY:coe,S.lease);
 const closeM=ready?0:monthsBetween(TODAY,coe);
 const monthsPaying=Math.max(0,12-S.lease);
 return {i,comm:comm[0],city,addr:h[2],plan:h[3],fl:h[4],beds:h[5],baths:h[6],sqft:h[7],price,coe,ready,closeM,rent,rs,yld:rent*12/price*100,y1:rent*monthsPaying,drop:h[11],conf:R.cities[city][2],proxy:R.cities[city][3]}}).filter(Boolean)}
function qTerms(q){return String(q||"").split(/[,;\n]+/).map(x=>x.trim().toLowerCase()).filter(Boolean)}
function filtered(){const qs=qTerms(S.q);let a=ALL.filter(h=>(!S.price||h.price<=S.price)&&h.beds>=S.beds&&(!S.months.length||S.months.includes(mKey(h)))&&h.yld>=S.minY&&(!S.cities.length||S.cities.includes(h.city))&&(!qs.length||qs.some(w=>(h.comm+" "+h.city+" "+h.addr).toLowerCase().includes(w))));
 const f={yield:(x,y)=>y.yld-x.yld,y1:(x,y)=>y.y1/y.price-x.y1/x.price,price:(x,y)=>x.price-y.price,rent:(x,y)=>y.rent-x.rent,soon:(x,y)=>x.coe-y.coe}[S.sort];return a.sort(f)}
function opts(list,cur){return list.map(([v,l])=>'<option value="'+v+'"'+(String(cur)===String(v)?" selected":"")+">"+esc(l)+"</option>").join("")}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";
 document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lg===lang));
 $("#who").textContent=t("who");
 if(!D){return}
 prep();const rows=filtered();const cityCounts={};ALL.forEach(h=>cityCounts[h.city]=(cityCounts[h.city]||0)+1);
 const cityList=Object.keys(cityCounts).sort();
 const monthCounts={};ALL.forEach(h=>{const k=mKey(h);monthCounts[k]=(monthCounts[k]||0)+1});
 const monthList=Object.keys(monthCounts).sort((a,b)=>a==="ready"?-1:b==="ready"?1:a<b?-1:1);S.months=S.months.filter(k=>monthCounts[k]);
 let h='<h1>'+esc(t("h1"))+'</h1><p class="sub">'+esc(t("sub"))+'</p><div class="note">'+esc(t("disc"))+'</div>';
 h+='<div class="card filters"><label class="srch">'+t("f_search")+'<input id="fq" type="search" list="commlist" autocomplete="off" value="'+esc(S.q)+'" placeholder="'+esc(t("f_search_ph"))+'"><datalist id="commlist">'+[...new Set(ALL.map(x=>x.comm))].sort().map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist></label>'
 +'<label>'+t("f_price")+'<input id="fp" type="text" inputmode="numeric" autocomplete="off" list="pricelist" placeholder="'+esc(t("any"))+'" value="'+(S.price?usd(S.price):"")+'"><datalist id="pricelist">'+[200000,250000,300000,350000,400000,500000].map(v=>'<option value="'+usd(v)+'">').join("")+'</datalist></label>'
 +'<label>'+t("f_beds")+'<select id="fb">'+opts([[0,t("any")],[3,t("b3")],[4,t("b4")],[5,t("b5")]],S.beds)+'</select></label>'
  +'<label>'+t("f_lease")+'<select id="fl">'+opts([[0,t("mo0")],[1,t("mo1")],[2,t("mo",{n:2})],[3,t("mo",{n:3})]],S.lease)+'</select></label>'
 +'<label>'+t("f_rent")+'<select id="fr">'+opts([[-10,t("r_low")],[0,t("r_mid")],[10,t("r_high")]],S.rent)+'</select></label>'
 +'<label>'+t("f_minY")+'<select id="fy">'+opts([[0,t("any")],[6,"6%+"],[7,"7%+"],[8,"8%+"],[9,"9%+"],[10,"10%+"]],S.minY)+'</select></label>'
 +'<label>'+t("f_sort")+'<select id="fs">'+opts([["yield",t("s_yield")],["y1",t("s_y1")],["price",t("s_price")],["rent",t("s_rent")],["soon",t("s_soon")]],S.sort)+'</select></label>'
 +'<details class="cities months"'+(S.months.length?" open":"")+'><summary>'+esc(S.months.length?t("months_n",{n:S.months.length}):t("months"))+'</summary><div class="loc">'+esc(t("m_hint"))+'</div><div class="chips">'
 +monthList.map(k=>'<button class="chip" data-month="'+k+'" aria-pressed="'+S.months.includes(k)+'">'+(S.months.includes(k)?"✓ ":"")+esc(k==="ready"?t("ready"):fmtMonth(new Date(+k.slice(0,4),+k.slice(5)-1,1)))+' <small>'+monthCounts[k]+'</small></button>').join("")
 +(S.months.length?'<button class="chip" id="clrm">'+esc(t("clear_m"))+'</button>':"")+'</div></details>'
 +'<details class="cities"><summary>'+esc(S.cities.length?t("cities_n",{n:S.cities.length}):t("cities"))+'</summary><div class="chips">'
 +cityList.map(c=>'<button class="chip" data-city="'+esc(c)+'" aria-pressed="'+S.cities.includes(c)+'">'+esc(c)+' <small>'+cityCounts[c]+'</small></button>').join("")
 +(S.cities.length?'<button class="chip" id="clr">'+esc(t("clear"))+'</button>':"")+'</div></details></div>';
 h+='<div class="bar"><div class="count">'+t("n_homes",{n:rows.length.toLocaleString("en-US")})+' <small>· '+t("shown",{n:Math.min(S.limit,rows.length)})+'</small></div><button class="btn share" id="share" type="button">🔗 '+esc(t("share"))+'</button></div>';
 if(!rows.length)h+='<p class="status">'+esc(t("none"))+'</p>';
 rows.slice(0,S.limit).forEach(x=>{
  h+='<article class="card home"><div><div class="addr">'+esc(x.addr)+'</div><div class="loc">'+esc(x.comm)+' · '+esc(x.city)+', TX'+'</div>'
  +'<div class="loc">'+esc(t("beds",{b:x.beds,ba:x.baths,sf:x.sqft.toLocaleString("en-US")}))+'</div>'
  +'<div class="loc">'+esc(t("planline",{p:x.plan,fl:t("story",{n:x.fl})}))+'</div>'
  +((x.drop||x.conf==="l")?'<div class="tags">'+(x.drop?'<span class="tag drop">▼ '+esc(t("dropped",{x:usd(x.drop-x.price)}))+'</span>':"")+(x.conf==="l"?'<span class="tag low">'+esc(t("low_conf"))+'</span>':"")+'</div>':"")+'</div>'
  +'<div class="big"><div class="y">'+x.yld.toFixed(1)+'%</div><div class="yl">'+esc(t("yield"))+'</div></div>'
  +'<div class="nums"><div><span>'+esc(t("price"))+'</span><b>'+usd(x.price)+'</b></div>'
  +'<div><span>'+esc(t("rent"))+'</span><b>'+usd(x.rent)+'</b></div>'
  +'<div><span>'+esc(t("close"))+'</span><b>'+(x.ready?esc(t("ready")):esc(fmtDate(x.coe)))+'</b></div>'
  +'<div><span>'+esc(t("first"))+'</span><b>'+esc(fmtDate(x.rs))+'</b></div>'
  +'<div><span>'+esc(t("y1"))+'</span><b>'+usd(x.y1)+'</b></div></div>'
  +'<div class="links"><a href="https://www.google.com/maps/search/'+encodeURIComponent("Lennar at "+x.comm+", "+x.city+", TX")+'" target="_blank" rel="noopener">'+esc(t("view"))+'</a></div></article>'});
 if(rows.length>S.limit)h+='<button class="more" id="more">'+esc(t("more",{n:Math.min(30,rows.length-S.limit)}))+'</button>';
 h+='<details class="card meth"><summary>'+esc(t("meth_h"))+'</summary><ul>'+t("meth").map(s=>"<li>"+esc(s)+"</li>").join("")+'</ul><b>'+esc(t("conf_h"))+'</b><table>'
 +Object.keys(R.cities).sort().map(c=>{const r=R.cities[c];return '<tr><td>'+esc(c)+'</td><td dir="ltr">3 bd '+usd(r[0])+' · 4 bd '+usd(r[1])+'</td><td>'+(r[2]==="l"?esc(t("conf_proxy",{x:r[3]})):esc(t("conf_city")))+'</td></tr>'}).join("")+'</table></details>';
 $("#app").innerHTML=h;
 $("#foot").innerHTML='<div class="contact"><b>'+esc(t("c_h"))+'</b><br>'+esc(t("c_p"))+'<br><br>'+CONTACT.name+'<br><a href="tel:+18307437270" dir="ltr">'+CONTACT.phone+'</a> · <a href="mailto:'+CONTACT.email+'" dir="ltr">'+CONTACT.email+'</a></div><div>'+esc(t("upd",{d:D.updated}))+' · <a href="'+SHEET_URL+'" target="_blank" rel="noopener">'+esc(t("sheet"))+'</a></div>';
 const bind=(id,k,num)=>{const e=$(id);if(e)e.onchange=()=>{S[k]=num?+e.value:e.value;S.limit=30;save();render()}};
 const fq=$("#fq");if(fq)fq.onpaste=e=>{const tx=(e.clipboardData||window.clipboardData).getData("text");if(/[\r\n]/.test(tx)){e.preventDefault();const ins=tx.split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean).join(", ");fq.setRangeText(ins,fq.selectionStart,fq.selectionEnd,"end");fq.dispatchEvent(new Event("input"))}};
 if(fq)fq.oninput=()=>{S.q=fq.value;S.limit=30;save();const p=fq.selectionStart;render();const n=$("#fq");if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}};
 const fp=$("#fp");if(fp)fp.onchange=()=>{let v=fp.value.trim().toLowerCase().replace(/[$,\s]/g,"");let n=parseFloat(v)||0;if(/k$/.test(v))n*=1000;else if(/m$/.test(v))n*=1e6;S.price=Math.max(0,Math.round(n));S.limit=30;save();render()};bind("#fb","beds",1);bind("#fl","lease",1);bind("#fr","rent",1);bind("#fy","minY",1);bind("#fs","sort",0);
 document.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{const c=b.dataset.city;S.cities=S.cities.includes(c)?S.cities.filter(x=>x!==c):S.cities.concat(c);S.limit=30;save();render();const d=$(".cities");if(d)d.open=true});
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{const k=b.dataset.month;S.months=S.months.includes(k)?S.months.filter(x=>x!==k):S.months.concat(k);S.limit=30;save();render()});
 const cm=$("#clrm");if(cm)cm.onclick=()=>{S.months=[];S.limit=30;save();render()};
 const cl=$("#clr");if(cl)cl.onclick=()=>{S.cities=[];save();render()};
 const sh=$("#share");if(sh)sh.onclick=()=>copyShare(sh);
 const mr=$("#more");if(mr)mr.onclick=()=>{S.limit+=30;render()};
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lg;try{localStorage.setItem("ih_lang",lang)}catch(e){}render()});
Promise.all([fetch("data.json",{cache:"no-store"}).then(r=>r.json()),fetch("rents.json",{cache:"no-store"}).then(r=>r.json())]).then(([d,r])=>{D=d;R=r;render()}).catch(()=>{$("#app").innerHTML='<p class="status">Could not load data.</p>'});
render();
</script></body></html>
